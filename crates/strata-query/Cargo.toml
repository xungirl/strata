[package]
name = "strata-query"
description = "Query parser and query engine (block-max WAND, boolean, phrase, prefix, filters) for strata"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
strata-core = { path = "../strata-core" }
strata-storage = { path = "../strata-storage" }
anyhow = "1.0.104"
fst = "0.4.7"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1.8.0"
serde_json = "1.0.154"
