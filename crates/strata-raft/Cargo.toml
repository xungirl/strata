[package]
name = "strata-raft"
description = "Raft consensus (own implementation) replicating strata shards"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
strata-core = { path = "../strata-core" }
strata-storage = { path = "../strata-storage" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
crc32fast = "1.5.5"
clap = { version = "4.5.61", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
