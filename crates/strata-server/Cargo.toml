[package]
name = "strata-server"
description = "strata node: HTTP + gRPC API, Prometheus metrics, tracing, load tester"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
strata-core = { path = "../strata-core" }
strata-storage = { path = "../strata-storage" }
strata-query = { path = "../strata-query" }
strata-vector = { path = "../strata-vector" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.5.61", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
tonic = "0.14.9"
tonic-prost = "0.14.9"
prost = "0.14.6"
prometheus = "0.14.0"
crc32fast = "1.5.5"
tracing = "0.1.44"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-stdout = "0.33.1"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
futures = "0.3.34"
strata-eval = { version = "0.1.0", path = "../strata-eval" }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }
