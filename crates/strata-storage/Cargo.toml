[package]
name = "strata-storage"
description = "On-disk segments, WAL, merges and snapshot readers for strata"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.5"
fst = "0.4.7"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strata-core = { version = "0.1.0", path = "../strata-core" }

[dev-dependencies]
proptest = "1.12.0"
