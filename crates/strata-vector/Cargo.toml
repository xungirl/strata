[package]
name = "strata-vector"
description = "Vector search for strata: SIMD distances, int8 scalar quantization, exact search and an HNSW index"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strata-eval = { path = "../strata-eval" }
clap = { version = "4.5.61", features = ["derive"] }

[dev-dependencies]
proptest = "1.8.0"
