[workspace]
resolver = "2"
members = ["crates/strata-core", "crates/strata-eval", "crates/strata-bench"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"

[profile.release]
# Debug symbols make profiling (Instruments / samply) readable without
# changing generated code.
debug = 1
